<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="n33t directory">

  <title>n33t</title>

  <style>
    :root {
      --background: #000;
      --foreground: #f5f5f5;
      --muted: #777;
      --pink: #ff69b4;
      --icon-size: 23px;
      --icon-gap: 30px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: var(--background);
      color: var(--foreground);
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
    }

    /* Centered page layout */

    .page {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px 76px;
    }

    .main-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      gap: 10px;
      animation: fade-in 1.2s ease both;
    }
	

    /* Animated logo GIF */

    .logo {
      display: block;
      width: min(90vw, 500px);
      max-height: 220px;
      height: auto;
      object-fit: contain;
      animation: float 5s ease-in-out infinite;
    }

    /* Social media icons */

    .socials {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: var(--icon-gap);
    }

    .social-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 42px;
      height: 42px;
      color: var(--muted);
      text-decoration: none;
      transform: scale(1);
      transition:
        color 220ms ease,
        transform 220ms ease;
      -webkit-tap-highlight-color: transparent;
    }

    .social-link svg {
      display: block;
      width: var(--icon-size);
      height: var(--icon-size);
      fill: currentColor;
    }

    .social-link:hover,
    .social-link:focus-visible {
      color: var(--pink);
      transform: scale(1.2);
    }

    .social-link:focus-visible {
      outline: 1px solid currentColor;
      outline-offset: 5px;
      border-radius: 4px;
    }

    /* Fixed scrolling copyright footer */

    .footer {
      position: fixed;
      z-index: 10;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 34px;
      display: flex;
      align-items: center;
      overflow: hidden;
      background: #000;
      border-top: 1px solid #161616;
    }

    .ticker {
      display: flex;
      width: max-content;
      flex-shrink: 0;
      animation: marquee 28s linear infinite;
      will-change: transform;
    }

    .ticker-group {
      display: flex;
      flex-shrink: 0;
      align-items: center;
    }

    .ticker span {
      padding-right: 34px;
      color: #777;
      font-size: 10px;
      font-weight: 400;
      letter-spacing: 2px;
      text-transform: uppercase;
      white-space: nowrap;
    }

    /* Animations */

    @keyframes fade-in {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-6px);
      }
    }

    @keyframes marquee {
      from {
        transform: translateX(0);
      }

      to {
        transform: translateX(-50%);
      }
    }

    /* Mobile optimization */

    @media (max-width: 480px) {
      :root {
        --icon-size: 22px;
        --icon-gap: 19px;
      }

      .page {
        padding: 24px 16px 60px;
      }

      .main-content {
        gap: 28px;
      }

      .logo {
        width: min(88vw, 360px);
        max-height: 180px;
      }

      .social-link {
        width: 38px;
        height: 42px;
      }

      .footer {
        height: 30px;
      }

      .ticker span {
        font-size: 9px;
        letter-spacing: 1.5px;
      }
    }

    /* Accessibility: respect reduced motion */

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
